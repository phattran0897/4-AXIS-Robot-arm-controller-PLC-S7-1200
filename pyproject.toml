[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
cache_dir = "build/.pytest_cache"
faulthandler_timeout = 30

[tool.ruff]
target-version = "py311"
exclude = [".agents", ".venv", ".pytest_cache", "build", "dist", "my_model"]

[tool.ruff.lint]
# Runtime errors first; avoid reformatting the existing UI and generated assets.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["src", "main"]

[tool.coverage.report]
show_missing = true
skip_empty = true
