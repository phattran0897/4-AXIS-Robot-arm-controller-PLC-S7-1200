# =============================================================================
#  config.yaml – Central configuration for the 4-Axis Industrial Robot System
#  Edit this file to adapt settings without touching source code.
# =============================================================================

# ── PLC / Siemens S7-1200 ────────────────────────────────────────────────────
plc:
  ip: "192.168.0.1"
  rack: 0
  slot: 1
  db_number: 5

  # Byte offsets inside the Data Block
  offsets:
    cmd_word: 0
    status: 2
    j1_target: 42
    j2_target: 46
    j3_target: 50
    j4_target: -1  # Not mapped in PLC Image, set to -1 to ignore
    motion_done_byte: 20
    motion_done_bit: 0
    error_flag_byte: 20
    error_flag_bit: 1
    phan_loai_hang_byte: 78
    phan_loai_hang_bit: 0
    hang_tot_byte: 78
    hang_tot_bit: 1
    hang_xau_byte: 78
    hang_xau_bit: 2

  # PLC command word values
  commands:
    idle: 0
    home: 1
    move: 2
    stop: 3
    grip: 4

# ── YOLO / AI Vision ─────────────────────────────────────────────────────────
yolo:
  model_path: "my_model/my_model.pt"
  thresh: 0.30

  # Pixel → millimetre scale factor (calibrate per camera/lens/mounting height)
  px2mm: 0.5 

  # Robot home position in mm (centre of workspace)
  home_x: 200.0
  home_y: 0.0

  # ── Manual Capture ROI ─────────────────────────────────────────────────────
  # Region of Interest for manual cropping (X, Y, Width, Height)
  roi_x: 190 
  roi_y: 100 
  roi_width: 200 
  roi_height: 190 
  
  # Optional: path to OpenCV camera calibration YAML (from cv2.calibrateCamera).
  # When set, frames are undistorted before inference for improved accuracy.
  # Leave empty to use the flat px2mm scalar fallback.
  calibration_path: ""

# ── Camera ───────────────────────────────────────────────────────────────────
camera:
  default_index: 0

  # Display resolution inside the GUI label (px)
  display_width: 440
  display_height: 310

  # Approximate target frame-rate for the AI processing loop
  fps: 60

  # GUI preview redraw rate (decoupled from camera fps to reduce CPU load)
  preview_fps: 20

  # YOLO inference resolution – smaller = faster inference, larger = more accurate
  inference_width: 640
  inference_height: 480

  # Camera read timeout in seconds (watchdog prevents indefinite blocking)
  read_timeout: 2.0

  # Apply unsharp mask sharpening to ROI crops before inference (set false to reduce latency)
  enable_unsharp_mask: true

# ── Kinematics (4-DOF Articulated Arm – DH Parameters) ───────────────────────
kinematics:
  # DH link parameters (mm)
  a1: 0.0      # Base horizontal offset
  d1: 189.6    # Base height
  a2: 190.0    # Link 2 length
  a3: 190.0    # Link 3 length
  a4: 74.0     # Link 4 / end-effector length

  # Joint angle limits (degrees)
  j1_min: -180.0
  j1_max: 180.0
  j2_min: -180.0
  j2_max: 250.0
  j3_min: 0.0
  j3_max: 200.0
  j4_min: -180.0
  j4_max: 180.0

  # Default end-effector pitch angle for IK (degrees)
  default_phi: 0.0

# ── Application / GUI ────────────────────────────────────────────────────────
app:
  title: "4-AXIS Industrial Robot Control | VAA"
  geometry: "1280x820"
  appearance_mode: "dark"       # "dark" | "light" | "system"
  color_theme: "blue"

  # Background cyclic PLC polling rate (seconds)
  plc_poll_interval: 0.1 

  # Minimum delay (seconds) after a MOVE command before re-triggering
  move_cooldown: 1.5 

# ── Sort Positions ──────────────────────────────────────────────────────────
sort_positions:
  place_good:
    x: 150.0
    y: 100.0
    z_down: 80.0 
    z_up: 150.0 
  place_bad:
    x: -150.0
    y: 100.0
    z_down: 80.0 
    z_up: 150.0 
  pick_z_down: 80.0
  pick_z_up: 150.0
  gripper_delay: 0.5

